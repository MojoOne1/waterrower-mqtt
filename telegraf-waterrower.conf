###############################################################################
# Telegraf: WaterRower MQTT -> InfluxDB
#
# Ablage:  /etc/telegraf/telegraf.d/waterrower.conf
# Neustart: systemctl restart telegraf
#
# Die ESPHome-Bridge published jeden Wert auf ein eigenes Topic als reine
# Zahl (bzw. ON/OFF), nicht als JSON. Deshalb "value"-Parser pro Topic.
###############################################################################

[agent]
  interval = "1s"
  flush_interval = "5s"
  omit_hostname = true

###############################################################################
# Ausgabe
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.XX:8086"]     # IP deines InfluxDB-LXC eintragen
  token = "$INFLUX_TOKEN"                # aus /etc/default/telegraf
  organization = "deine-org"
  bucket = "waterrower"

###############################################################################
# Eingaenge - ein Block pro Datentyp, weil die Parser sich unterscheiden
###############################################################################

# --- Numerische Messwerte -----------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.XX:1883"]   # IP deines Mosquitto-Brokers
  username = "$MQTT_USER"
  password = "$MQTT_PASS"
  client_id = "telegraf-waterrower"

  topics = [
    "waterrower/distance",
    "waterrower/speed",
    "waterrower/stroke_rate",
    "waterrower/duration",
  ]

  data_format = "value"
  data_type = "float"

  # Messreihe heisst einheitlich "waterrower", der Feldname kommt aus
  # dem letzten Topic-Segment (distance, speed, ...).
  name_override = "waterrower"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "waterrower/+"
    measurement = "_/_"
    tags = ""
    fields = ""

# --- Session-ID als Tag verfuegbar machen -------------------------------
# Wird als eigener Punkt geschrieben; in Flux/InfluxQL laesst sich damit
# nach Trainingseinheit gruppieren.
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.XX:1883"]
  username = "$MQTT_USER"
  password = "$MQTT_PASS"
  client_id = "telegraf-waterrower-session"

  topics = ["waterrower/session_id"]
  data_format = "value"
  data_type = "string"
  name_override = "waterrower_session"

# --- Session-Status (ON/OFF) --------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.XX:1883"]
  username = "$MQTT_USER"
  password = "$MQTT_PASS"
  client_id = "telegraf-waterrower-state"

  topics = ["waterrower/session_active"]
  data_format = "value"
  data_type = "string"
  name_override = "waterrower_state"
