# Local test stack: arena and tracker, both built from this checkout, both
# reachable on localhost. No tunnel, no registry, no .env.
#
#   docker compose -f server/docker-compose.local.yml up -d --build
#
#   Arena    http://localhost:8090   sign in as  admin / test1234
#   Tracker  http://localhost:8080
#
# To try the uplink: in the arena under Konto -> Tracker-Verbindung mint a
# token, then in the tracker under Arena enter  http://arena:8090  (the
# container name - they share this network) and paste the token.
#
# Tear down with:  docker compose -f server/docker-compose.local.yml down
# Add -v to that to throw the databases away as well.
name: waterrower-local

services:
  arena:
    build:
      context: .
    container_name: waterrower-arena-local
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Europe/Berlin
      ARENA_ADMIN_USER: admin
      ARENA_ADMIN_NAME: Admin
      ARENA_ADMIN_PASSWORD: test1234
      # Plain http on localhost, so the session cookie must not be Secure.
      ARENA_SECURE_COOKIES: 0
      # Shorter than the real thing - nobody wants to wait ten seconds
      # while testing.
      ARENA_COUNTDOWN: 5
    volumes:
      - arena-data:/data

  tracker:
    build:
      context: ../docker
    container_name: waterrower-tracker-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      # Leave empty and fill the form in the UI, or put your broker here.
      MQTT_HOST: ""
      MQTT_PORT: 1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_PREFIX: waterrower
    volumes:
      - tracker-data:/data

volumes:
  arena-data:
  tracker-data:
