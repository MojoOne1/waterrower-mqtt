# Keep in sync with the VERSION file at the repo root; releases are
# tagged v<version> in git, which is how a firmware maps to a commit.
substitutions:
  version: "1.4.0"

esphome:
  name: esphome-waterrower
  friendly_name: WaterRower
  min_version: 2026.4.0
  project:
    name: "mojoone1.waterrower-mqtt"
    version: "${version}"
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  logs:
    # entity state publishes are event-driven (see publish_sensors) but
    # still ~15 lines per second during a workout - keep them out of the log
    sensor: INFO
    text_sensor: INFO

api:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 3        # sorting_groups needs v3
  local: true
  allowed_origins:
    - "http://homeassistant.local:8123"   # address of your Home Assistant
  sorting_groups:
    - id: wr_group_live
      name: "Live"
      sorting_weight: 10
    - id: wr_group_session
      name: "Session"
      sorting_weight: 20
    - id: wr_group_control
      name: "Control"
      sorting_weight: 30
    - id: wr_group_diag
      name: "Diagnostics"
      sorting_weight: 40

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username_waterrower
  password: !secret mqtt_password_waterrower
  discovery: false
  topic_prefix: waterrower
  reboot_timeout: 0s
  on_connect:
    - lambda: id(wr_firmware_version).update();
  on_message:
    # Sent by the tracker's "End session" button (payload "reset" also
    # resets the monitor); any other payload just closes the session.
    - topic: waterrower/cmd/end_session
      then:
        - if:
            condition:
              lambda: return x == "reset";
            then:
              - script.execute: s4_reset
            else:
              - if:
                  condition:
                    lambda: return id(session_active);
                  then:
                    - script.execute: end_session

time:
  - platform: sntp
    id: sntp_time

usb_uart:
  - type: cdc_acm
    vid: 0x0000
    pid: 0x0000
    channels:
      - id: s4_uart
        baud_rate: 19200
        buffer_size: 1024
        debug: false

###############################################################################
# State
###############################################################################
globals:
  # --- Receive ---
  - id: s4_rx_buffer
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: s4_last_raw_line
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_rx_ms              # last line of any kind (link supervision)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: poll_tick
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: rowing_idle             # S4 says "no rowing" (PING); per-stroke values read as 0
    type: bool
    restore_value: false
    initial_value: "true"
  # --- USB link state (see the 1 s interval) ---
  - id: s4_present              # S4 is enumerated on USB, i.e. switched on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: usb_mode                # S4 answered "USB" and is streaming packets
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sleeping                # we left USB mode on purpose; only probe occasionally
    type: bool
    restore_value: false
    initial_value: "false"
  - id: usb_idle_since_ms       # last stroke / link-up / session end
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_probe_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_handshake_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: status_key              # last published combination of the link flags
    type: uint8_t
    restore_value: false
    initial_value: "255"

  # --- Readings (addresses per "Water Rower S4 S5 USB Protocol Iss 1.04") ---
  - id: s4_distance_m           # 057/058 distance_low/hi
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_speed_cms            # 14A/14B m_s_low/hi_average (cm/s) - matches the display
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_stroke_rate          # 1A9 zone_sr_val
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_strokes              # 140/141 strokes_cnt_low/hi
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_stroke_avg_25ms      # 142 stroke_average (unit: 25 ms)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_stroke_pull_25ms     # 143 stroke_pull (unit: 25 ms)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_elapsed_s            # 1E1/1E2/1E3 (BCD)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_total_distance_m     # 081/082 total_dis_low/hi (lifetime counter)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_watts                # 088/089 kcal_watts_low/hi - scaling UNVERIFIED
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_heart_rate           # 1A0 zone_hr_val - chest strap only
    type: float
    restore_value: false
    initial_value: "0"

  # --- Session ---
  - id: session_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: session_id
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: sess_speed_sum
    type: float
    restore_value: false
    initial_value: "0"
  - id: sess_spm_sum
    type: float
    restore_value: false
    initial_value: "0"
  - id: sess_samples
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_summary_json
    type: std::string
    restore_value: false
    initial_value: '""'

###############################################################################
# Scripts
###############################################################################
script:
  # Spec p.4: "USB" opens communication, reply "_WR_".
  - id: s4_handshake
    then:
      - uart.write:
          id: s4_uart
          data: "USB\r\n"
      - delay: 200ms
      - uart.write:
          id: s4_uart
          data: "IV?\r\n"

  # Spec p.4: EXIT ends USB mode; the S4 then behaves as if no PC were
  # attached, which is what lets its auto power-off kick in.
  - id: s4_exit
    then:
      - uart.write:
          id: s4_uart
          data: "EXIT\r\n"
      - lambda: |-
          id(usb_mode) = false;
          id(sleeping) = true;
          id(last_probe_ms) = millis();
          ESP_LOGI("s4", "Left USB mode (idle); probing every %d min",
                   (int) id(wr_probe_interval).state);

  # Entities publish only when called from here: every second during a
  # workout, once after the handshake, on the idle transition and after a
  # session ends or the monitor is reset. Idle = no publishes, quiet log.
  - id: publish_sensors
    then:
      - lambda: |-
          id(wr_distance).update();
          id(wr_speed).update();
          id(wr_split_s).update();
          id(wr_stroke_rate).update();
          id(wr_strokes).update();
          id(wr_ratio).update();
          id(wr_pull_time).update();
          id(wr_elapsed).update();
          id(wr_watts).update();
          id(wr_total_distance).update();
          id(wr_sess_avg_speed).update();
          id(wr_sess_avg_spm).update();
          id(wr_elapsed_formatted).update();
          id(wr_split).update();
          id(wr_session_id).update();
          id(wr_last_summary).update();
          id(wr_raw_debug).update();

  # After the handshake: read everything once so HA shows current values,
  # give the S4 time to answer, publish, then stay quiet.
  - id: initial_poll
    then:
      - script.execute: poll_s4
      - script.wait: poll_s4
      - script.execute: poll_s4_slow
      - delay: 300ms
      - script.execute: publish_sensors

  # Spec p.1: at most one packet per 25 ms.
  - id: poll_s4
    then:
      - uart.write:
          id: s4_uart
          data: "IRD057\r\n"    # distance (displayed)
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRD14A\r\n"    # speed
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRS1A9\r\n"    # stroke rate
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRD140\r\n"    # stroke count
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRS142\r\n"    # stroke_average
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRS143\r\n"    # stroke_pull
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRT1E1\r\n"    # time hh/mm/ss
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRD088\r\n"    # watts (unverified)
      # Heart rate, chest strap only:
      # - delay: 30ms
      # - uart.write:
      #     id: s4_uart
      #     data: "IRS1A0\r\n"

  # Slowly changing values - every few seconds is enough.
  - id: poll_s4_slow
    then:
      - uart.write:
          id: s4_uart
          data: "IRD081\r\n"    # lifetime distance

  - id: start_session
    then:
      - lambda: |-
          char buf[32];
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            snprintf(buf, sizeof(buf), "%04d%02d%02dT%02d%02d%02d",
                     t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          } else {
            snprintf(buf, sizeof(buf), "boot-%u", (unsigned) (millis() / 1000));
          }
          id(session_id) = std::string(buf);
          id(session_active) = true;
          id(sess_speed_sum) = 0;
          id(sess_spm_sum) = 0;
          id(sess_samples) = 0;
          ESP_LOGI("session", "Start %s", buf);

  # Called on activity timeout: build the summary, publish it retained,
  # close the session.
  - id: end_session
    then:
      - lambda: |-
          float avg_speed = id(sess_samples) ? id(sess_speed_sum) / id(sess_samples) / 100.0f : 0;
          float avg_spm   = id(sess_samples) ? id(sess_spm_sum)   / id(sess_samples)          : 0;
          char buf[256];
          snprintf(buf, sizeof(buf),
            "{\"session_id\":\"%s\",\"distance_m\":%d,\"duration_s\":%d,"
            "\"strokes\":%d,\"avg_speed_ms\":%.2f,\"avg_spm\":%.1f}",
            id(session_id).c_str(), (int) id(s4_distance_m), (int) id(s4_elapsed_s),
            (int) id(s4_strokes), avg_speed, avg_spm);
          id(last_summary_json) = std::string(buf);
          id(session_active) = false;
          id(usb_idle_since_ms) = millis();
          ESP_LOGI("session", "End %s", buf);
      - mqtt.publish:
          topic: waterrower/session/last
          retain: true
          payload: !lambda return id(last_summary_json);
      - script.execute: poll_s4_slow   # final lifetime distance
      - delay: 300ms
      - script.execute: publish_sensors

  # Spec p.5: RESET = like the power button on the monitor. A running
  # session is closed first so the summary isn't lost. Our copies of the
  # display values are cleared too - nothing polls them while idle, so
  # they'd otherwise stay stale until the next session.
  - id: s4_reset
    then:
      - if:
          condition:
            lambda: return id(session_active);
          then:
            - script.execute: end_session
            - script.wait: end_session
      - delay: 50ms
      - uart.write:
          id: s4_uart
          data: "RESET\r\n"
      - lambda: |-
          id(s4_distance_m) = 0;
          id(s4_elapsed_s) = 0;
          id(s4_strokes) = 0;
          id(s4_speed_cms) = 0;
          id(s4_stroke_rate) = 0;
          id(s4_watts) = 0;
          id(s4_stroke_avg_25ms) = 0;
          id(s4_stroke_pull_25ms) = 0;
          // RESET also ends USB mode on the S4 (spec: interactive mode
          // disabled); the link manager re-handshakes, then idles out.
          id(usb_mode) = false;
          id(sleeping) = false;
          id(usb_idle_since_ms) = millis();
      - script.execute: publish_sensors

  # All live values bundled incl. the session ID, one message per second
  # during a session - this is what the tracker records.
  - id: publish_live_json
    then:
      - mqtt.publish_json:
          topic: waterrower/live
          payload: |-
            root["session_id"]  = id(session_id);
            root["distance_m"]  = (int) id(s4_distance_m);
            root["speed_ms"]    = id(s4_speed_cms) / 100.0f;
            root["stroke_rate"] = (int) id(s4_stroke_rate);
            root["strokes"]     = (int) id(s4_strokes);
            root["duration_s"]  = (int) id(s4_elapsed_s);
            root["watts"]       = (int) id(s4_watts);

###############################################################################
# Timers
###############################################################################
interval:
  # Link manager + polling.
  #
  # The S4 only switches itself off outside USB mode, so after a workout
  # the link goes: idle timeout -> EXIT -> "sleeping" (a probe handshake
  # every few minutes in case rowing resumes). Once the S4 powers off it
  # disappears from USB (is_connected() false) and nothing is sent at all;
  # when it reappears the handshake follows within seconds.
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = millis();
          bool present = id(s4_uart)->is_connected();
          if (present != id(s4_present)) {
            id(s4_present) = present;
            if (present) {
              ESP_LOGI("s4", "S4 connected (switched on)");
              id(sleeping) = false;
              id(last_handshake_ms) = 0;
            } else {
              ESP_LOGW("s4", "S4 disconnected (switched off?)");
              id(usb_mode) = false;
              id(sleeping) = false;
              if (id(session_active)) id(end_session).execute();
            }
          }
          if (present && id(wr_usb_link).state) {
            if (id(usb_mode)) {
              if (now - id(last_rx_ms) > 10000) {
                ESP_LOGW("s4", "No data from S4 for >10 s, USB mode lost");
                id(usb_mode) = false;
              } else if (!id(session_active) &&
                         now - id(usb_idle_since_ms) > (uint32_t) (id(wr_usb_idle_timeout).state * 1000.0f)) {
                id(s4_exit).execute();
              }
            } else {
              bool due = !id(sleeping) ||
                         now - id(last_probe_ms) > (uint32_t) (id(wr_probe_interval).state * 60000.0f);
              if (due && now - id(last_handshake_ms) > 5000) {
                id(last_handshake_ms) = now;
                id(last_probe_ms) = now;
                id(s4_handshake).execute();
              }
            }
          }

          // Human-readable link status, published whenever a flag changes.
          uint8_t key = (present ? 8 : 0) | (id(session_active) ? 4 : 0) |
                        (id(usb_mode) ? 2 : 0) | (id(sleeping) ? 1 : 0);
          if (key != id(status_key)) {
            id(status_key) = key;
            id(wr_s4_status).update();
          }

          // Polling only during a workout - every packet the S4 receives
          // counts as activity for it.
          if (id(session_active)) {
            id(poll_tick) = (id(poll_tick) + 1) % 5;
            id(poll_s4).execute();
            if (id(poll_tick) == 0) id(poll_s4_slow).execute();
          }

          // accumulate per-second session averages
          if (id(session_active)) {
            id(sess_speed_sum) += id(s4_speed_cms);
            id(sess_spm_sum)   += id(s4_stroke_rate);
            id(sess_samples)   += 1;
            id(publish_live_json).execute();
            id(publish_sensors).execute();
          }

          // activity timeout -> end the session (safety net; normally the
          // user ends it with the tracker's button)
          uint32_t timeout_ms = (uint32_t) (id(wr_session_timeout).state * 60000.0f);
          if (id(session_active) && (millis() - id(last_activity_ms) > timeout_ms)) {
            id(end_session).execute();
          }

  # Link supervision: the S4 sends PING every second while idle.
  # 10 s of silence = link dead -> redo the handshake.
  # Receive and parse
  - interval: 100ms
    then:
      - lambda: |-
          auto bcd = [](int b) { return ((b >> 4) & 0x0F) * 10 + (b & 0x0F); };
          // Any stroke/paddle packet keeps a session alive; only a real
          // stroke start (SS) may begin one - residual water movement
          // after a session shouldn't start the next.
          auto mark_activity = [&](bool stroke_start) {
            id(last_activity_ms) = millis();
            id(usb_idle_since_ms) = millis();
            id(rowing_idle) = false;
            if (stroke_start && !id(session_active)) id(start_session).execute();
          };

          while (id(s4_uart)->available()) {
            uint8_t c;
            id(s4_uart)->read_byte(&c);

            if (c != '\r' && c != '\n') {
              id(s4_rx_buffer) += (char) c;
              if (id(s4_rx_buffer).size() > 40) id(s4_rx_buffer).clear();
              continue;
            }
            if (id(s4_rx_buffer).empty()) continue;

            std::string line = id(s4_rx_buffer);
            id(s4_rx_buffer).clear();
            id(last_rx_ms) = millis();

            // Stroke events and paddle pulses are the S4's own activity
            // signals (auto-sent while rowing); PING means "no rowing".
            if (line == "SS" || line == "SE" || (line.size() == 3 && line[0] == 'P')) {
              mark_activity(line == "SS");
              continue;
            }
            if (line == "_WR_") {
              if (!id(usb_mode)) ESP_LOGI("s4", "S4 link up (USB mode)");
              id(usb_mode) = true;
              id(sleeping) = false;
              id(usb_idle_since_ms) = millis();
              id(initial_poll).execute();
              continue;
            }
            if (line == "PING") {
              // Sent only while no rowing occurs. The S4 keeps showing the
              // last stroke's speed/rate/watts, we'd rather show zeros.
              if (!id(rowing_idle) && millis() - id(last_activity_ms) > 2000) {
                id(rowing_idle) = true;
                id(s4_speed_cms) = 0;
                id(s4_stroke_rate) = 0;
                id(s4_watts) = 0;
                id(publish_sensors).execute();
              }
              continue;
            }
            if (line == "OK") continue;

            id(s4_last_raw_line) = line;

            if (line.size() >= 8 && line.compare(0, 3, "IDS") == 0) {
              std::string addr = line.substr(3, 3);
              int val = strtol(line.substr(6, 2).c_str(), nullptr, 16);
              if (addr == "1A9") id(s4_stroke_rate) = id(rowing_idle) ? 0 : val;
              if (addr == "142") id(s4_stroke_avg_25ms) = val;
              if (addr == "143") id(s4_stroke_pull_25ms) = val;
              if (addr == "1A0") id(s4_heart_rate) = val;

            } else if (line.size() >= 10 && line.compare(0, 3, "IDD") == 0) {
              std::string addr = line.substr(3, 3);
              int val = strtol(line.substr(6, 4).c_str(), nullptr, 16);
              if (addr == "057") id(s4_distance_m) = val;
              if (addr == "140") id(s4_strokes) = val;
              if (addr == "081") id(s4_total_distance_m) = val;
              if (addr == "088") id(s4_watts) = id(rowing_idle) ? 0 : val;
              // 14A holds its last value after rowing stops: it must NOT
              // count as activity (only SS/SE/Pxx do), and reads as 0
              // while the S4 reports idle.
              if (addr == "14A") id(s4_speed_cms) = id(rowing_idle) ? 0 : val;

            } else if (line.size() >= 12 && line.compare(0, 3, "IDT") == 0) {
              std::string addr = line.substr(3, 3);
              if (addr == "1E1") {
                int h = bcd(strtol(line.substr(6, 2).c_str(),  nullptr, 16));
                int m = bcd(strtol(line.substr(8, 2).c_str(),  nullptr, 16));
                int s = bcd(strtol(line.substr(10, 2).c_str(), nullptr, 16));
                id(s4_elapsed_s) = h * 3600 + m * 60 + s;
              }
            }
          }

###############################################################################
# Entities
###############################################################################
sensor:
  - platform: template
    name: "Distance"
    id: wr_distance
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 40}
    state_topic: waterrower/distance
    unit_of_measurement: "m"
    accuracy_decimals: 0
    lambda: return id(s4_distance_m);
    update_interval: never

  - platform: template
    name: "Speed"
    id: wr_speed
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 10}
    state_topic: waterrower/speed
    unit_of_measurement: "m/s"
    accuracy_decimals: 2
    lambda: return id(s4_speed_cms) / 100.0f;
    update_interval: never

  # Numeric twin of the "500m Split" text sensor, so it can be graphed.
  - platform: template
    name: "500m Split (s)"
    id: wr_split_s
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 35}
    state_topic: waterrower/split_500m_s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (id(s4_speed_cms) <= 0) return NAN;
      return 500.0f / (id(s4_speed_cms) / 100.0f);
    update_interval: never

  - platform: template
    name: "Stroke Rate"
    id: wr_stroke_rate
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 20}
    state_topic: waterrower/stroke_rate
    unit_of_measurement: "spm"
    accuracy_decimals: 0
    lambda: return id(s4_stroke_rate);
    update_interval: never

  - platform: template
    name: "Strokes"
    id: wr_strokes
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 60}
    state_topic: waterrower/strokes
    accuracy_decimals: 0
    lambda: return id(s4_strokes);
    update_interval: never

  # Spec p.20: (stroke_average - stroke_pull) * 1.25 = ratio display.
  # Check against the "ratio" value on the display.
  - platform: template
    name: "Ratio"
    id: wr_ratio
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 90}
    state_topic: waterrower/ratio
    accuracy_decimals: 2
    lambda: |-
      if (id(s4_stroke_pull_25ms) <= 0) return 0.0f;
      return (id(s4_stroke_avg_25ms) - id(s4_stroke_pull_25ms)) * 1.25f;
    update_interval: never

  - platform: template
    name: "Pull Time"
    id: wr_pull_time
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 80}
    unit_of_measurement: "s"
    accuracy_decimals: 2
    lambda: return id(s4_stroke_pull_25ms) * 0.025f;
    update_interval: never

  - platform: template
    name: "Duration"
    id: wr_elapsed
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 55}
    state_topic: waterrower/duration
    unit_of_measurement: "s"
    accuracy_decimals: 0
    device_class: duration
    lambda: return id(s4_elapsed_s);
    update_interval: never

  - platform: template
    name: "Watts"
    id: wr_watts
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 70}
    state_topic: waterrower/watts
    unit_of_measurement: "W"
    accuracy_decimals: 0
    lambda: return id(s4_watts);
    update_interval: never

  - platform: template
    name: "Total Distance"
    id: wr_total_distance
    web_server: {sorting_group_id: wr_group_session, sorting_weight: 60}
    state_topic: waterrower/total_distance
    unit_of_measurement: "m"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(s4_total_distance_m);
    update_interval: never

  - platform: template
    name: "Session Avg Speed"
    id: wr_sess_avg_speed
    web_server: {sorting_group_id: wr_group_session, sorting_weight: 30}
    unit_of_measurement: "m/s"
    accuracy_decimals: 2
    lambda: |-
      if (!id(sess_samples)) return 0.0f;
      return id(sess_speed_sum) / id(sess_samples) / 100.0f;
    update_interval: never

  - platform: template
    name: "Session Avg Stroke Rate"
    id: wr_sess_avg_spm
    web_server: {sorting_group_id: wr_group_session, sorting_weight: 40}
    unit_of_measurement: "spm"
    accuracy_decimals: 1
    lambda: |-
      if (!id(sess_samples)) return 0.0f;
      return id(sess_spm_sum) / id(sess_samples);
    update_interval: never

  # - platform: template
  #   name: "Heart Rate"
  #   id: wr_heart_rate
  #   state_topic: waterrower/heart_rate
  #   unit_of_measurement: "bpm"
  #   accuracy_decimals: 0
  #   lambda: return id(s4_heart_rate);
  #   update_interval: never   # and add id(wr_heart_rate).update() to publish_sensors

binary_sensor:
  - platform: template
    name: "S4 Connected"
    id: wr_s4_connected
    state_topic: waterrower/s4_connected
    entity_category: diagnostic
    web_server: {sorting_group_id: wr_group_diag, sorting_weight: 20}
    lambda: return id(s4_present);

  - platform: template
    name: "USB Mode"
    id: wr_usb_mode
    state_topic: waterrower/usb_mode
    entity_category: diagnostic
    web_server: {sorting_group_id: wr_group_diag, sorting_weight: 30}
    lambda: return id(usb_mode);

  - platform: template
    name: "Session Active"
    id: wr_session_active
    web_server: {sorting_group_id: wr_group_session, sorting_weight: 10}
    state_topic: waterrower/session_active
    lambda: return id(session_active);

text_sensor:
  # Project version (also published for the tracker's footer) and the
  # ESPHome build incl. compile timestamp - both visible in the web UI.
  - platform: template
    name: "Firmware Version"
    id: wr_firmware_version
    state_topic: waterrower/firmware_version
    entity_category: diagnostic
    web_server: {sorting_group_id: wr_group_diag, sorting_weight: 50}
    lambda: return {std::string("${version}")};
    update_interval: never   # published on MQTT connect (retained)

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    web_server: {sorting_group_id: wr_group_diag, sorting_weight: 60}

  # One line that says what the link is doing right now.
  - platform: template
    name: "S4 Status"
    id: wr_s4_status
    entity_category: diagnostic
    web_server: {sorting_group_id: wr_group_diag, sorting_weight: 10}
    update_interval: never
    lambda: |-
      if (!id(s4_present)) return {std::string("off / not connected")};
      if (id(session_active)) return {std::string("recording")};
      if (id(usb_mode)) return {std::string("connected, USB mode")};
      if (id(sleeping)) return {std::string("connected, sleeping (EXIT sent)")};
      return {std::string("connected, handshake pending")};

  - platform: template
    name: "Duration (hh:mm:ss)"
    id: wr_elapsed_formatted
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 50}
    update_interval: never
    lambda: |-
      int total = (int) id(s4_elapsed_s);
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d",
               total / 3600, (total % 3600) / 60, total % 60);
      return {std::string(buf)};

  - platform: template
    name: "500m Split"
    id: wr_split
    web_server: {sorting_group_id: wr_group_live, sorting_weight: 30}
    state_topic: waterrower/split_500m
    update_interval: never
    lambda: |-
      if (id(s4_speed_cms) <= 0) return {std::string("--:--")};
      int split = (int) (500.0f / (id(s4_speed_cms) / 100.0f));
      char buf[16];
      snprintf(buf, sizeof(buf), "%d:%02d", split / 60, split % 60);
      return {std::string(buf)};

  - platform: template
    name: "Session ID"
    id: wr_session_id
    web_server: {sorting_group_id: wr_group_session, sorting_weight: 20}
    state_topic: waterrower/session_id
    lambda: return {id(session_id)};
    update_interval: never

  - platform: template
    name: "Last Session"
    id: wr_last_summary
    web_server: {sorting_group_id: wr_group_session, sorting_weight: 50}
    lambda: return {id(last_summary_json)};
    update_interval: never

  - platform: template
    name: "S4 Raw Data"
    id: wr_raw_debug
    entity_category: diagnostic
    web_server: {sorting_group_id: wr_group_diag, sorting_weight: 40}
    lambda: return {id(s4_last_raw_line)};
    update_interval: never

number:
  # Minutes without a stroke after which a session ends on its own.
  - platform: template
    name: "Session Timeout"
    id: wr_session_timeout
    entity_category: config
    web_server: {sorting_group_id: wr_group_control, sorting_weight: 30}
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true

  # Seconds without a stroke (outside a session) before the ESP leaves
  # USB mode so the S4 can power itself off.
  - platform: template
    name: "USB Idle Timeout"
    id: wr_usb_idle_timeout
    entity_category: config
    web_server: {sorting_group_id: wr_group_control, sorting_weight: 40}
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 60
    restore_value: true
    optimistic: true

  # While sleeping (S4 still on, but not in USB mode): minutes between
  # handshake probes, in case rowing resumes without a power cycle.
  - platform: template
    name: "USB Probe Interval"
    id: wr_probe_interval
    entity_category: config
    web_server: {sorting_group_id: wr_group_control, sorting_weight: 50}
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 4
    restore_value: true
    optimistic: true

switch:
  # Off = fully passive: leave USB mode and never handshake. Useful to
  # check whether the S4 powers off with just VBUS and enumeration.
  - platform: template
    name: "USB Link"
    id: wr_usb_link
    entity_category: config
    web_server: {sorting_group_id: wr_group_control, sorting_weight: 20}
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(sleeping) = false;
          id(last_handshake_ms) = 0;
    turn_off_action:
      - lambda: |-
          if (id(usb_mode)) id(s4_exit).execute();

button:
  - platform: template
    name: "Reset"
    id: wr_reset
    web_server: {sorting_group_id: wr_group_control, sorting_weight: 10}
    on_press:
      - script.execute: s4_reset
