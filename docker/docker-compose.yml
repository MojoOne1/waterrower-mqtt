# Row alone: the tracker, and nothing else.
#
#   docker compose up -d
#
# It records, charts and exports your rowing on its own. This is also the
# file to use when you join somebody else's arena - the uplink is a setting
# in the form, not a different deployment, so there is nothing more to run.
#
# Rowing together, as in providing the arena, is the compose file at the
# repository root.
#
# No `name:` and no `container_name:` on purpose. Both pin a name that
# should follow the deployment instead: Dockge names the project after the
# stack folder, and a pinned one makes it look for containers labelled
# something else - the stack then reads as inactive while it runs fine. A
# pinned container_name is worse still, being global rather than per
# project, so a leftover from another stack blocks the name outright.
#
# Nothing here needs a checkout - the image comes from GHCR, built by
# .github/workflows/docker-publish.yml. Drop this file in a Dockge or
# Portainer stack folder and it works.
#
# ---------------------------------------------------------------------------
# No MQTT broker in the house?
# ---------------------------------------------------------------------------
# The firmware needs a broker, not Home Assistant. If you have neither,
# uncomment the `mosquitto` block at the bottom and leave MQTT_HOST at
# `mosquitto` - that is the container name and they share this network.
#
# Mosquitto 2 listens on nothing and admits nobody until told, so create the
# password file the shipped mosquitto.conf points at first. The ESP and the
# tracker both sign in with it:
#
#   mkdir -p mosquitto/config mosquitto/data
#   docker run --rm -v "$PWD/mosquitto/config:/mosquitto/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /mosquitto/config/passwd waterrower DEIN-PASSWORT
#
# Put that password in a .env next to this file as MQTT_PASSWORD, and the
# same user and password into the ESP's secrets.yaml.
#
# ---------------------------------------------------------------------------
# Changing the firmware without Home Assistant
# ---------------------------------------------------------------------------
# Uncomment the `esphome` block at the bottom and open http://<host>:6052/.
# That is the ESPHome dashboard: it edits the YAML in the browser, compiles
# it and flashes the ESP over the air - the whole job, from the people who
# wrote the firmware format. The YAML is already there: the tracker ships
# the one this release was built against, and its Firmware card writes it
# into ./esphome-data for you - both containers share that folder. Add your
# own secrets.yaml beside it, then Install -> Wirelessly.
#
# The tracker does not compile anything itself on purpose: that needs
# PlatformIO and an ESP32 toolchain, and this container's one job is to
# keep recording. Paste the dashboard's address into the tracker's Firmware
# card and it links straight there.
#
# The first build downloads the toolchain and takes a few minutes; after
# that it is cached in ./esphome/.esphome. Shut the container down again
# when you are done if you would rather not leave it running.

services:
  waterrower-tracker:
    image: ghcr.io/mojoone1/waterrower-mqtt:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Must match the ESP's time zone: session IDs are local timestamps.
      TZ: Europe/Berlin
      # Your own broker, or `mosquitto` if you uncommented the block below.
      # Anything saved through the settings form lands in ./data/settings.json
      # and wins over these from then on.
      MQTT_HOST: "${MQTT_HOST:-mosquitto}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-waterrower}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_PREFIX: waterrower
      # The arena's address can be pre-filled here, but the token cannot -
      # it is minted in the arena and pasted into the tracker's Arena form.
      # Setting only the address switches the uplink on with nothing to sign
      # in with, so both are left to the form.
      # ARENA_URL: https://arena.example.com
    volumes:
      - ./data:/data
      # Shared with the esphome container below, if you uncomment it:
      # the Firmware card writes the YAML here and the dashboard sees it.
      - ./esphome-data:/esphome

  # --- Uncomment for a broker of your own ----------------------------------
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   restart: unless-stopped
  #   ports:
  #     # The ESP is on the network, not in this stack, so this one has to be
  #     # published. Keep it on the LAN - do not forward it from the router.
  #     - "1883:1883"
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config
  #     - ./mosquitto/data:/mosquitto/data

  # --- Uncomment to edit and flash the firmware from a browser --------------
  # esphome:
  #   image: ghcr.io/esphome/esphome:latest
  #   restart: unless-stopped
  #   ports:
  #     - "6052:6052"
  #   environment:
  #     TZ: Europe/Berlin
  #   volumes:
  #     # Your waterrower.yaml and secrets.yaml live here, and so does the
  #     # build cache - losing it only costs the next build some minutes.
  #     - ./esphome-data:/config
  #   # OTA finds the ESP by mDNS, which does not cross the bridge network.
  #   # Host networking is the simple answer on Linux; on Docker Desktop it
  #   # is not, so there put the device's IP in the YAML as `use_address`
  #   # and drop this line.
  #   network_mode: host
