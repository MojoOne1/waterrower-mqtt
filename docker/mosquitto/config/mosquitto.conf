# Minimal broker for a household without Home Assistant.
# Version 2 of Mosquitto listens on nothing and allows nobody until told,
# which is the right default and the reason this file has to exist.

listener 1883

# The ESP and the tracker both sign in. Create the file next to this one:
#   docker run --rm -v "$PWD/mosquitto/config:/mosquitto/config" \
#     eclipse-mosquitto:2 mosquitto_passwd -c -b /mosquitto/config/passwd waterrower SECRET
allow_anonymous false
password_file /mosquitto/config/passwd

# Keeps retained messages - session/last among them - across a restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
