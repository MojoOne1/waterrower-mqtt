# Deploy-ready stack: pulls the prebuilt image from GHCR (built by
# .github/workflows/docker-publish.yml on every push to master).
# This is the only file needed on a deployment host / in a Dockge stack
# folder - no repo checkout, no local build.
services:
  waterrower-tracker:
    image: ghcr.io/mojoone1/waterrower-mqtt:latest
    container_name: waterrower-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Optional: pre-fill the settings form. Anything saved through the form
    # ends up in ./data/settings.json and takes precedence.
    environment:
      MQTT_HOST: ""
      MQTT_PORT: 1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_PREFIX: waterrower
    volumes:
      - ./data:/data
