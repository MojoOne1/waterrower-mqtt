###############################################################################
# Telegraf: WaterRower MQTT -> InfluxDB
#
# Location: /etc/telegraf/telegraf.d/waterrower.conf
# Restart:  systemctl restart telegraf
#
# The ESPHome bridge publishes every value on its own topic as a plain
# number (or ON/OFF), not as JSON. Hence one "value" parser per topic.
###############################################################################

[agent]
  interval = "1s"
  flush_interval = "5s"
  omit_hostname = true

###############################################################################
# Output
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.XX:8086"]     # address of your InfluxDB
  token = "$INFLUX_TOKEN"                # from /etc/default/telegraf
  organization = "your-org"
  bucket = "waterrower"

###############################################################################
# Inputs - one block per data type, because the parsers differ
###############################################################################

# --- Numeric readings --------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.XX:1883"]   # address of your Mosquitto broker
  username = "$MQTT_USER"
  password = "$MQTT_PASS"
  client_id = "telegraf-waterrower"

  topics = [
    "waterrower/distance",
    "waterrower/speed",
    "waterrower/stroke_rate",
    "waterrower/duration",
  ]

  data_format = "value"
  data_type = "float"

  # The measurement is uniformly "waterrower"; the field name comes from
  # the last topic segment (distance, speed, ...).
  name_override = "waterrower"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "waterrower/+"
    measurement = "_/_"
    tags = ""
    fields = ""

# --- Session ID as a tag ------------------------------------------------
# Written as its own point; in Flux/InfluxQL this allows grouping by
# workout session.
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.XX:1883"]
  username = "$MQTT_USER"
  password = "$MQTT_PASS"
  client_id = "telegraf-waterrower-session"

  topics = ["waterrower/session_id"]
  data_format = "value"
  data_type = "string"
  name_override = "waterrower_session"

# --- Session state (ON/OFF) ---------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.XX:1883"]
  username = "$MQTT_USER"
  password = "$MQTT_PASS"
  client_id = "telegraf-waterrower-state"

  topics = ["waterrower/session_active"]
  data_format = "value"
  data_type = "string"
  name_override = "waterrower_state"
