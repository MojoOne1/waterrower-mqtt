# Tracker *and* a broker, for a household without Home Assistant.
#
# The firmware needs an MQTT broker; Home Assistant is the usual place to
# find one, but nothing here depends on it. This stack brings its own
# Mosquitto, so the ESP has somewhere to publish and the tracker has
# somewhere to listen.
#
#   docker compose -f docker-compose.mosquitto.yml up -d
#
#   Tracker  http://<host>:8080
#   Broker   <host>:1883
#
# Before the first start, create the password file the broker expects -
# the ESP and the tracker both sign in with it:
#
#   mkdir -p mosquitto/config mosquitto/data
#   docker run --rm -v "$PWD/mosquitto/config:/mosquitto/config" \
#     eclipse-mosquitto:2 mosquitto_passwd -c -b /mosquitto/config/passwd waterrower DEIN-PASSWORT
#
# Then put the same user and password into the ESP's secrets.yaml
# (mqtt_username_waterrower / mqtt_password_waterrower, broker = this host)
# and into the tracker's settings form.
name: waterrower

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: waterrower-mosquitto
    restart: unless-stopped
    ports:
      # The ESP is on the network, not in this stack, so this one has to be
      # published. Keep it on the LAN - do not forward it from the router.
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    # mosquitto/config/mosquitto.conf comes with the repository; only the
    # password file next to it has to be created (see the header above).

  waterrower-tracker:
    image: ghcr.io/mojoone1/waterrower-mqtt:latest
    container_name: waterrower-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Must match the ESP's time zone: session IDs are local timestamps.
      TZ: Europe/Berlin
      # `mosquitto` is the container name - they share this stack's network.
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: waterrower
      MQTT_PASSWORD: "${MQTT_PASSWORD:?put MQTT_PASSWORD in .env}"
      MQTT_PREFIX: waterrower
      # Optional: pre-fill the arena uplink instead of using the form.
      # ARENA_URL: https://arena.example.com
      # ARENA_TOKEN: ""
    volumes:
      - ./data:/data
    depends_on:
      - mosquitto
