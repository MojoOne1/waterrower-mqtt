<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterRower</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <h1>WaterRower</h1>
  <div class="top-right">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <span class="s4" id="s4"><span class="dot"></span><span id="s4-text" data-i18n="s4Unknown"></span></span>
    <button class="conn" id="conn" type="button" aria-expanded="false" aria-controls="settings">
      <span class="dot"></span><span id="conn-text" data-i18n="connecting"></span>
    </button>
  </div>
</header>

<section class="settings" id="settings" hidden>
  <form id="settings-form">
    <h2 data-i18n="settingsTitle"></h2>
    <div class="fields">
      <label><span data-i18n="labelHost"></span> <input name="host" required data-i18n-placeholder="phHost"></label>
      <label><span data-i18n="labelPort"></span> <input name="port" type="number" min="1" max="65535" value="1883"></label>
      <label><span data-i18n="labelUser"></span> <input name="username" autocomplete="off" data-i18n-placeholder="phOptional"></label>
      <label><span data-i18n="labelPassword"></span> <input name="password" type="password" autocomplete="new-password" data-i18n-placeholder="phOptional"></label>
      <label><span data-i18n="labelPrefix"></span> <input name="prefix" value="waterrower"></label>
    </div>
    <p class="hint" data-i18n-html="settingsHint"></p>
    <div class="form-foot">
      <span class="form-msg" id="settings-msg"></span>
      <button type="submit" class="primary" data-i18n="btnConnect"></button>
    </div>
  </form>
</section>

<section class="monitor" aria-label="Performance Monitor">
  <div class="lcd">
    <div class="cell cell-sr">
      <span class="lbl">strokerate</span>
      <span class="val" id="lcd-sr">--</span>
      <span class="unit">strokes/min</span>
    </div>
    <div class="cell cell-int">
      <span class="lbl">intensity</span>
      <span class="val big" id="lcd-speed">-.--</span>
      <span class="unit">m/s</span>
    </div>
    <div class="cell cell-dur">
      <span class="lbl">duration</span>
      <span class="val" id="lcd-dur">--:--</span>
    </div>
    <div class="cell cell-dist">
      <span class="lbl">distance</span>
      <span class="val" id="lcd-dist">---</span>
      <span class="unit">meters</span>
    </div>
  </div>
  <div class="session-row">
    <p class="session-line" id="session-line" data-i18n="waiting"></p>
    <button id="end" type="button" data-i18n="endSession" hidden></button>
  </div>
</section>

<main class="work">
  <aside class="list">
    <h2 data-i18n="sessionsTitle"></h2>
    <ul id="sessions"></ul>
    <p class="empty" id="sessions-empty" data-i18n="sessionsEmpty"></p>
  </aside>

  <section class="detail" id="detail" hidden>
    <div class="detail-head">
      <h2 id="detail-title"></h2>
      <div class="actions">
        <label class="cmp"><input type="checkbox" id="cmp-toggle"> <span data-i18n="compare"></span></label>
        <a id="csv" href="#">CSV</a>
        <button id="del" type="button" data-i18n="delete"></button>
      </div>
    </div>
    <dl class="facts" id="facts"></dl>

    <figure>
      <figcaption><span data-i18n="chartSpeed"></span><span class="readout" id="ro-speed"></span></figcaption>
      <canvas id="ch-speed" height="200"></canvas>
    </figure>
    <figure>
      <figcaption><span data-i18n="chartSpm"></span><span class="readout" id="ro-spm"></span></figcaption>
      <canvas id="ch-spm" height="120"></canvas>
    </figure>
  </section>

  <section class="compare" id="compare" hidden>
    <div class="detail-head">
      <h2 data-i18n="compareTitle"></h2>
      <button id="cmp-clear" type="button" data-i18n="clearSelection"></button>
    </div>
    <ul class="legend" id="legend"></ul>
    <figure>
      <figcaption><span data-i18n="chartCmp"></span><span class="readout" id="ro-cmp"></span></figcaption>
      <canvas id="ch-cmp" height="220"></canvas>
    </figure>
    <table class="cmp-table" id="cmp-table"></table>
  </section>

  <section class="trend" id="trend" hidden>
    <div class="detail-head">
      <h2 data-i18n="allSessions"></h2>
      <span class="hint" id="trend-sum"></span>
    </div>
    <figure>
      <figcaption><span data-i18n="chartTrend"></span><span class="readout" id="ro-trend"></span></figcaption>
      <canvas id="ch-trend" height="150"></canvas>
    </figure>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<script src="/static/app.js"></script>
</body>
</html>
