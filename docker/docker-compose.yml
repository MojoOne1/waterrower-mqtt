# Row alone: the tracker, and nothing else.
#
#   docker compose up -d
#
# It records, charts and exports your rowing on its own. This is also the
# file to use when you join somebody else's arena - the uplink is a setting
# in the form, not a different deployment, so there is nothing more to run.
#
# Rowing together, as in providing the arena, is the compose file at the
# repository root.
#
# Nothing here needs a checkout - the image comes from GHCR, built by
# .github/workflows/docker-publish.yml. Drop this file in a Dockge or
# Portainer stack folder and it works.
#
# ---------------------------------------------------------------------------
# No MQTT broker in the house?
# ---------------------------------------------------------------------------
# The firmware needs a broker, not Home Assistant. If you have neither,
# uncomment the `mosquitto` block at the bottom and leave MQTT_HOST at
# `mosquitto` - that is the container name and they share this network.
#
# Mosquitto 2 listens on nothing and admits nobody until told, so create the
# password file the shipped mosquitto.conf points at first. The ESP and the
# tracker both sign in with it:
#
#   mkdir -p mosquitto/config mosquitto/data
#   docker run --rm -v "$PWD/mosquitto/config:/mosquitto/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /mosquitto/config/passwd waterrower DEIN-PASSWORT
#
# Put that password in a .env next to this file as MQTT_PASSWORD, and the
# same user and password into the ESP's secrets.yaml.
name: waterrower

services:
  waterrower-tracker:
    image: ghcr.io/mojoone1/waterrower-mqtt:latest
    container_name: waterrower-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Must match the ESP's time zone: session IDs are local timestamps.
      TZ: Europe/Berlin
      # Your own broker, or `mosquitto` if you uncommented the block below.
      # Anything saved through the settings form lands in ./data/settings.json
      # and wins over these from then on.
      MQTT_HOST: "${MQTT_HOST:-mosquitto}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-waterrower}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_PREFIX: waterrower
      # The arena's address can be pre-filled here, but the token cannot -
      # it is minted in the arena and pasted into the tracker's Arena form.
      # Setting only the address switches the uplink on with nothing to sign
      # in with, so both are left to the form.
      # ARENA_URL: https://arena.example.com
    volumes:
      - ./data:/data

  # --- Uncomment for a broker of your own ----------------------------------
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   container_name: waterrower-mosquitto
  #   restart: unless-stopped
  #   ports:
  #     # The ESP is on the network, not in this stack, so this one has to be
  #     # published. Keep it on the LAN - do not forward it from the router.
  #     - "1883:1883"
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config
  #     - ./mosquitto/data:/mosquitto/data
