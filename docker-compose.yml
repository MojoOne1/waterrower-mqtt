services:
  waterrower-tracker:
    build: ./docker
    container_name: waterrower-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Optional: pre-fill the settings form. Anything saved through the form
    # ends up in ./docker/data/settings.json and takes precedence.
    environment:
      MQTT_HOST: ""
      MQTT_PORT: 1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_PREFIX: waterrower
    volumes:
      - ./docker/data:/data
