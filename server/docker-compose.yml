# WaterRower Arena - the shared server.
#
# ---------------------------------------------------------------------------
# Quick start on a Docker VM
# ---------------------------------------------------------------------------
# Put this repo on the VM, create a .env next to this file (see .env.example)
# with at least:
#
#     ARENA_ADMIN_PASSWORD=something-long
#
# then, from this folder:
#
#     docker compose up -d --build          # build from source, no tunnel
#
# The UI is on http://<vm>:8090 - sign in as `admin` with that password.
#
# ---------------------------------------------------------------------------
# Publishing it through Cloudflare Tunnel
# ---------------------------------------------------------------------------
# 1. Cloudflare Zero Trust -> Networks -> Tunnels -> create a tunnel, copy
#    its token into .env as TUNNEL_TOKEN.
# 2. In the tunnel's Public Hostname tab, point your hostname
#    (e.g. arena.example.com) at  http://arena:8090 .
# 3. Start it with the tunnel profile:
#
#     docker compose --profile tunnel up -d --build
#
# cloudflared dials out, so nothing needs forwarding and there is no
# certificate to renew. Once it works over the hostname you can drop the
# `ports:` block below and reach it only through the tunnel.
#
# ---------------------------------------------------------------------------
# Once the image is published
# ---------------------------------------------------------------------------
# After this branch lands on master the workflow publishes the image, and a
# host needs nothing but this file - leave off --build and it pulls instead:
#
#     docker compose --profile tunnel up -d
#
name: waterrower-arena

services:
  arena:
    # Both are given on purpose: with --build it builds from this folder and
    # tags the result; without, it pulls the published image.
    image: ghcr.io/mojoone1/waterrower-mqtt/arena:latest
    build:
      context: .
    container_name: waterrower-arena
    restart: unless-stopped
    ports:
      # Drop this once the tunnel is doing the work.
      - "8090:8090"
    environment:
      TZ: Europe/Berlin
      # The bootstrap login. Only read while no `admin` athlete exists, so
      # changing it later does nothing - use the UI for that.
      ARENA_ADMIN_USER: admin
      ARENA_ADMIN_NAME: Admin
      ARENA_ADMIN_PASSWORD: "${ARENA_ADMIN_PASSWORD:?put ARENA_ADMIN_PASSWORD in .env}"
      # Cloudflare terminates TLS, so the cookie stays Secure even though
      # this container is spoken to over plain HTTP. Set to 0 while you are
      # testing over http://<vm>:8090 - a Secure cookie is dropped there and
      # the sign-in would not stick.
      ARENA_SECURE_COOKIES: "${ARENA_SECURE_COOKIES:-0}"
      ARENA_COUNTDOWN: 10
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: waterrower-arena-tunnel
    restart: unless-stopped
    # Only started with:  docker compose --profile tunnel up -d
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?put TUNNEL_TOKEN in .env}"
    depends_on:
      - arena
