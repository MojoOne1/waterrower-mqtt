esphome:
  name: esphome-waterrower
  friendly_name: ESPHome Waterrower
  min_version: 2026.4.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - script.execute: s4_handshake

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  local: true
  allowed_origins:
    - "http://homeassistant.local:8123"   # address of your Home Assistant

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username_waterrower
  password: !secret mqtt_password_waterrower
  discovery: false
  topic_prefix: waterrower
  reboot_timeout: 0s

time:
  - platform: sntp
    id: sntp_time

usb_uart:
  - type: cdc_acm
    vid: 0x0000
    pid: 0x0000
    channels:
      - id: s4_uart
        baud_rate: 19200
        buffer_size: 1024
        debug: false

###############################################################################
# State
###############################################################################
globals:
  # --- Receive ---
  - id: s4_rx_buffer
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: s4_last_raw_line
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_rx_ms              # last line of any kind (link supervision)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: poll_tick
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # --- Readings (addresses per "Water Rower S4 S5 USB Protocol Iss 1.04") ---
  - id: s4_distance_m           # 057/058 distance_low/hi
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_speed_cms            # 14A/14B m_s_low/hi_average (cm/s) - matches the display
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_stroke_rate          # 1A9 zone_sr_val
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_strokes              # 140/141 strokes_cnt_low/hi
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_stroke_avg_25ms      # 142 stroke_average (unit: 25 ms)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_stroke_pull_25ms     # 143 stroke_pull (unit: 25 ms)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_elapsed_s            # 1E1/1E2/1E3 (BCD)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_total_distance_m     # 081/082 total_dis_low/hi (lifetime counter)
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_watts                # 088/089 kcal_watts_low/hi - scaling UNVERIFIED
    type: float
    restore_value: false
    initial_value: "0"
  - id: s4_heart_rate           # 1A0 zone_hr_val - chest strap only
    type: float
    restore_value: false
    initial_value: "0"

  # --- Session ---
  - id: session_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: session_id
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: sess_speed_sum
    type: float
    restore_value: false
    initial_value: "0"
  - id: sess_spm_sum
    type: float
    restore_value: false
    initial_value: "0"
  - id: sess_samples
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_summary_json
    type: std::string
    restore_value: false
    initial_value: '""'

###############################################################################
# Scripts
###############################################################################
script:
  # Spec p.4: "USB" opens communication, reply "_WR_".
  - id: s4_handshake
    then:
      - uart.write:
          id: s4_uart
          data: "USB\r\n"
      - delay: 200ms
      - uart.write:
          id: s4_uart
          data: "IV?\r\n"

  # Spec p.1: at most one packet per 25 ms.
  - id: poll_s4
    then:
      - uart.write:
          id: s4_uart
          data: "IRD057\r\n"    # distance (displayed)
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRD14A\r\n"    # speed
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRS1A9\r\n"    # stroke rate
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRD140\r\n"    # stroke count
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRS142\r\n"    # stroke_average
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRS143\r\n"    # stroke_pull
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRT1E1\r\n"    # time hh/mm/ss
      - delay: 30ms
      - uart.write:
          id: s4_uart
          data: "IRD088\r\n"    # watts (unverified)
      # Heart rate, chest strap only:
      # - delay: 30ms
      # - uart.write:
      #     id: s4_uart
      #     data: "IRS1A0\r\n"

  # Slowly changing values - every few seconds is enough.
  - id: poll_s4_slow
    then:
      - uart.write:
          id: s4_uart
          data: "IRD081\r\n"    # lifetime distance

  - id: start_session
    then:
      - lambda: |-
          char buf[32];
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            snprintf(buf, sizeof(buf), "%04d%02d%02dT%02d%02d%02d",
                     t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          } else {
            snprintf(buf, sizeof(buf), "boot-%u", (unsigned) (millis() / 1000));
          }
          id(session_id) = std::string(buf);
          id(session_active) = true;
          id(sess_speed_sum) = 0;
          id(sess_spm_sum) = 0;
          id(sess_samples) = 0;
          ESP_LOGI("session", "Start %s", buf);

  # Called on activity timeout: build the summary, publish it retained,
  # close the session.
  - id: end_session
    then:
      - lambda: |-
          float avg_speed = id(sess_samples) ? id(sess_speed_sum) / id(sess_samples) / 100.0f : 0;
          float avg_spm   = id(sess_samples) ? id(sess_spm_sum)   / id(sess_samples)          : 0;
          char buf[256];
          snprintf(buf, sizeof(buf),
            "{\"session_id\":\"%s\",\"distance_m\":%d,\"duration_s\":%d,"
            "\"strokes\":%d,\"avg_speed_ms\":%.2f,\"avg_spm\":%.1f}",
            id(session_id).c_str(), (int) id(s4_distance_m), (int) id(s4_elapsed_s),
            (int) id(s4_strokes), avg_speed, avg_spm);
          id(last_summary_json) = std::string(buf);
          id(session_active) = false;
          ESP_LOGI("session", "End %s", buf);
      - mqtt.publish:
          topic: waterrower/session/last
          retain: true
          payload: !lambda return id(last_summary_json);
      - script.execute: poll_s4_slow   # final lifetime distance

  # All live values bundled incl. the session ID - for Telegraf/InfluxDB,
  # so the ID is attached to the data point as a tag.
  - id: publish_live_json
    then:
      - mqtt.publish_json:
          topic: waterrower/live
          payload: |-
            root["session_id"]  = id(session_id);
            root["distance_m"]  = (int) id(s4_distance_m);
            root["speed_ms"]    = id(s4_speed_cms) / 100.0f;
            root["stroke_rate"] = (int) id(s4_stroke_rate);
            root["strokes"]     = (int) id(s4_strokes);
            root["duration_s"]  = (int) id(s4_elapsed_s);
            root["watts"]       = (int) id(s4_watts);

###############################################################################
# Timers
###############################################################################
interval:
  # Polling only during a workout. While idle the S4 gets no requests at
  # all - every packet it receives resets its auto power-off timer, so
  # polling would keep it awake forever. Its PING every second is enough
  # for link supervision.
  - interval: 1s
    then:
      - lambda: |-
          if (id(session_active)) {
            id(poll_tick) = (id(poll_tick) + 1) % 5;
            id(poll_s4).execute();
            if (id(poll_tick) == 0) id(poll_s4_slow).execute();
          }

          // accumulate per-second session averages
          if (id(session_active)) {
            id(sess_speed_sum) += id(s4_speed_cms);
            id(sess_spm_sum)   += id(s4_stroke_rate);
            id(sess_samples)   += 1;
            id(publish_live_json).execute();
          }

          // activity timeout -> end the session
          if (id(session_active) && (millis() - id(last_activity_ms) > 30000)) {
            id(end_session).execute();
          }

  # Link supervision: the S4 sends PING every second while idle.
  # 10 s of silence = link dead -> redo the handshake.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return (millis() - id(last_rx_ms)) > 10000;
          then:
            - logger.log:
                level: WARN
                format: "No data from S4 for >10 s, redoing handshake"
            - script.execute: s4_handshake

  # Receive and parse
  - interval: 100ms
    then:
      - lambda: |-
          auto bcd = [](int b) { return ((b >> 4) & 0x0F) * 10 + (b & 0x0F); };
          auto mark_activity = [&]() {
            id(last_activity_ms) = millis();
            if (!id(session_active)) id(start_session).execute();
          };

          while (id(s4_uart)->available()) {
            uint8_t c;
            id(s4_uart)->read_byte(&c);

            if (c != '\r' && c != '\n') {
              id(s4_rx_buffer) += (char) c;
              if (id(s4_rx_buffer).size() > 40) id(s4_rx_buffer).clear();
              continue;
            }
            if (id(s4_rx_buffer).empty()) continue;

            std::string line = id(s4_rx_buffer);
            id(s4_rx_buffer).clear();
            id(last_rx_ms) = millis();

            // stroke events and paddle pulses: activity, no value
            if (line == "SS" || line == "SE" || (line.size() == 3 && line[0] == 'P')) {
              mark_activity();
              continue;
            }
            if (line == "_WR_") {
              // handshake done: read everything once so HA shows current
              // values, then stay quiet until a session starts
              id(poll_s4).execute();
              id(poll_s4_slow).execute();
              continue;
            }
            if (line == "PING" || line == "OK") continue;

            id(s4_last_raw_line) = line;

            if (line.size() >= 8 && line.compare(0, 3, "IDS") == 0) {
              std::string addr = line.substr(3, 3);
              int val = strtol(line.substr(6, 2).c_str(), nullptr, 16);
              if (addr == "1A9") id(s4_stroke_rate) = val;
              if (addr == "142") id(s4_stroke_avg_25ms) = val;
              if (addr == "143") id(s4_stroke_pull_25ms) = val;
              if (addr == "1A0") id(s4_heart_rate) = val;

            } else if (line.size() >= 10 && line.compare(0, 3, "IDD") == 0) {
              std::string addr = line.substr(3, 3);
              int val = strtol(line.substr(6, 4).c_str(), nullptr, 16);
              if (addr == "057") id(s4_distance_m) = val;
              if (addr == "140") id(s4_strokes) = val;
              if (addr == "081") id(s4_total_distance_m) = val;
              if (addr == "088") id(s4_watts) = val;
              if (addr == "14A") {
                id(s4_speed_cms) = val;
                if (val > 0) mark_activity();
              }

            } else if (line.size() >= 12 && line.compare(0, 3, "IDT") == 0) {
              std::string addr = line.substr(3, 3);
              if (addr == "1E1") {
                int h = bcd(strtol(line.substr(6, 2).c_str(),  nullptr, 16));
                int m = bcd(strtol(line.substr(8, 2).c_str(),  nullptr, 16));
                int s = bcd(strtol(line.substr(10, 2).c_str(), nullptr, 16));
                id(s4_elapsed_s) = h * 3600 + m * 60 + s;
              }
            }
          }

###############################################################################
# Entities
###############################################################################
sensor:
  - platform: template
    name: "WaterRower Distance"
    id: wr_distance
    state_topic: waterrower/distance
    unit_of_measurement: "m"
    accuracy_decimals: 0
    lambda: return id(s4_distance_m);
    update_interval: 1s

  - platform: template
    name: "WaterRower Speed"
    id: wr_speed
    state_topic: waterrower/speed
    unit_of_measurement: "m/s"
    accuracy_decimals: 2
    lambda: return id(s4_speed_cms) / 100.0f;
    update_interval: 1s

  - platform: template
    name: "WaterRower Stroke Rate"
    id: wr_stroke_rate
    state_topic: waterrower/stroke_rate
    unit_of_measurement: "spm"
    accuracy_decimals: 0
    lambda: return id(s4_stroke_rate);
    update_interval: 1s

  - platform: template
    name: "WaterRower Strokes"
    id: wr_strokes
    state_topic: waterrower/strokes
    accuracy_decimals: 0
    lambda: return id(s4_strokes);
    update_interval: 1s

  # Spec p.20: (stroke_average - stroke_pull) * 1.25 = ratio display.
  # Check against the "ratio" value on the display.
  - platform: template
    name: "WaterRower Ratio"
    id: wr_ratio
    state_topic: waterrower/ratio
    accuracy_decimals: 2
    lambda: |-
      if (id(s4_stroke_pull_25ms) <= 0) return 0.0f;
      return (id(s4_stroke_avg_25ms) - id(s4_stroke_pull_25ms)) * 1.25f;
    update_interval: 1s

  - platform: template
    name: "WaterRower Pull Time"
    id: wr_pull_time
    unit_of_measurement: "s"
    accuracy_decimals: 2
    lambda: return id(s4_stroke_pull_25ms) * 0.025f;
    update_interval: 1s

  - platform: template
    name: "WaterRower Duration"
    id: wr_elapsed
    state_topic: waterrower/duration
    unit_of_measurement: "s"
    accuracy_decimals: 0
    device_class: duration
    lambda: return id(s4_elapsed_s);
    update_interval: 1s

  - platform: template
    name: "WaterRower Watts"
    id: wr_watts
    state_topic: waterrower/watts
    unit_of_measurement: "W"
    accuracy_decimals: 0
    lambda: return id(s4_watts);
    update_interval: 1s

  - platform: template
    name: "WaterRower Total Distance"
    id: wr_total_distance
    state_topic: waterrower/total_distance
    unit_of_measurement: "m"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(s4_total_distance_m);
    update_interval: 10s

  - platform: template
    name: "WaterRower Session Avg Speed"
    id: wr_sess_avg_speed
    unit_of_measurement: "m/s"
    accuracy_decimals: 2
    lambda: |-
      if (!id(sess_samples)) return 0.0f;
      return id(sess_speed_sum) / id(sess_samples) / 100.0f;
    update_interval: 2s

  - platform: template
    name: "WaterRower Session Avg Stroke Rate"
    id: wr_sess_avg_spm
    unit_of_measurement: "spm"
    accuracy_decimals: 1
    lambda: |-
      if (!id(sess_samples)) return 0.0f;
      return id(sess_spm_sum) / id(sess_samples);
    update_interval: 2s

  # - platform: template
  #   name: "WaterRower Heart Rate"
  #   id: wr_heart_rate
  #   state_topic: waterrower/heart_rate
  #   unit_of_measurement: "bpm"
  #   accuracy_decimals: 0
  #   lambda: return id(s4_heart_rate);
  #   update_interval: 1s

binary_sensor:
  - platform: template
    name: "WaterRower Session Active"
    id: wr_session_active
    state_topic: waterrower/session_active
    lambda: return id(session_active);

text_sensor:
  - platform: template
    name: "WaterRower Duration (hh:mm:ss)"
    id: wr_elapsed_formatted
    update_interval: 1s
    lambda: |-
      int total = (int) id(s4_elapsed_s);
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d",
               total / 3600, (total % 3600) / 60, total % 60);
      return {std::string(buf)};

  - platform: template
    name: "WaterRower 500m Split"
    id: wr_split
    state_topic: waterrower/split_500m
    update_interval: 1s
    lambda: |-
      if (id(s4_speed_cms) <= 0) return {std::string("--:--")};
      int split = (int) (500.0f / (id(s4_speed_cms) / 100.0f));
      char buf[16];
      snprintf(buf, sizeof(buf), "%d:%02d", split / 60, split % 60);
      return {std::string(buf)};

  - platform: template
    name: "WaterRower Session ID"
    id: wr_session_id
    state_topic: waterrower/session_id
    lambda: return {id(session_id)};
    update_interval: 1s

  - platform: template
    name: "WaterRower Last Session"
    id: wr_last_summary
    lambda: return {id(last_summary_json)};
    update_interval: 5s

  - platform: template
    name: "WaterRower S4 Raw Data"
    id: wr_raw_debug
    lambda: return {id(s4_last_raw_line)};
    update_interval: 1s

button:
  # Spec p.5: RESET = like the power button on the monitor. A running
  # session is closed cleanly first so the summary isn't lost.
  - platform: template
    name: "WaterRower Reset"
    id: wr_reset
    on_press:
      - if:
          condition:
            lambda: return id(session_active);
          then:
            - script.execute: end_session
      - uart.write:
          id: s4_uart
          data: "RESET\r\n"
